<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مدونة ابو عابد - Abo Abed</title>
    <meta name="robots" content="noindex, nofollow"> {/* To prevent indexing admin pages */}
    <!--
      The path to style.css should be relative to this HTML file's location in the project root.
      Vite will handle CSS imports within the React app itself (e.g., in main.jsx or App.jsx).
      This global CSS is for base styles and potentially for elements outside React's control,
      or if React app doesn't import its own copy of the global styles.
    -->
    <link rel="stylesheet" href="/css/style.css">
    <script>
        // Redirect to login if not authenticated
        // This is a client-side check; server-side protection would also be needed in a real app.
        if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
            // Assuming admin_login.html is in the 'pages' directory relative to the project root
            window.location.href = '/pages/admin_login.html';
        }
    </script>
    <style>
        /* Ensure layout takes full height for admin panel */
        html, body, #root, .admin-layout {
            height: 100%;
            margin: 0;
            display: flex; /* For .admin-layout if it's direct child of #root */
            flex-direction: column; /* If #root is the flex container */
        }
        body {
             overflow-x: hidden; /* Prevent horizontal scroll if sidebar/content slightly overflows */
        }
        #root {
            display: flex; /* Make #root a flex container for admin-layout */
            flex: 1; /* Allow #root to grow and fill body */
        }
        .admin-layout {
            display: flex;
            flex: 1; /* Allow admin-layout to grow and fill #root */
            width: 100%; /* Ensure it takes full width */
        }
        .sidebar {
            min-width: 250px; /* Minimum width for the sidebar */
            width: 250px;
            background-color: #f8f9fa; /* Light background for sidebar */
            padding: 1rem;
            border-left: 1px solid #e0e0e0; /* For RTL, border is on the left */
            height: 100%;
            overflow-y: auto;
        }
        html[dir="ltr"] .sidebar { /* For LTR if ever used */
            border-right: 1px solid #e0e0e0;
            border-left: none;
        }
        .admin-content {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto; /* Allow content to scroll */
            height: 100%; /* Ensure content area can use full height */
            box-sizing: border-box;
        }
        .sidebar-header h3 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .sidebar-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-nav li a {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 0.5rem;
            transition: background-color 0.3s, color 0.3s;
        }
        .sidebar-nav li a:hover {
            background-color: #e9ecef;
        }
        /* Active style for NavLink is handled by inline style in Sidebar.jsx for now */

        .sidebar-footer {
            margin-top: auto; /* Pushes footer to bottom of sidebar */
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
            text-align: center;
        }
         body.dark-mode .sidebar {
            background-color: var(--header-bg); /* Uses dark mode header color */
            border-left-color: var(--card-border);
        }
        body.dark-mode .sidebar-nav li a {
            color: var(--text-color);
        }
        body.dark-mode .sidebar-nav li a:hover {
            background-color: #2c2c2c; /* Darker hover for sidebar links */
        }
        body.dark-mode .sidebar-header h3 {
             color: var(--primary-color);
        }

    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
